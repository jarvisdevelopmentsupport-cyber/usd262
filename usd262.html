<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabspace Games</title>
    <link rel="icon" href="https://core-logic-utils.github.io/assets/tabspacelogo.png">
    <meta name="description" content="Tabspace Games — play games in your browser.">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
        --bg: #0b0506;
        --panel: #1a0d0f;
        --panel-2: #241216;
        --border: #3a1a1f;
        --accent: #ef4444;
        --accent-dark: #b91c1c;
        --accent-glow: rgba(239, 68, 68, 0.35);
        --accent-rgb: 239, 68, 68;
        --accent-dark-rgb: 185, 28, 28;
        --accent-light: #fca5a5;
        --bg-rgb: 11, 5, 6;
        --panel-rgb: 26, 13, 15;
        --panel-hi-rgb: 60, 20, 26;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        font-family: 'Inter', sans-serif;
        color: white;
        overflow-x: hidden;
    }

    /* ---------- Interactive background ---------- */
    #bg-canvas {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0; pointer-events: none;
    }

    /* ---------- Search bar (top middle) ---------- */
    #search-wrap {
        position: fixed; top: 18px; left: 50%;
        transform: translateX(-50%);
        z-index: 60;
        width: min(460px, calc(100vw - 150px));
    }
    #search-wrap i {
        position: absolute; left: 16px; top: 50%;
        transform: translateY(-50%);
        color: #a1a1aa; font-size: .9rem; pointer-events: none;
    }
    #search {
        width: 100%;
        background: rgba(var(--panel-rgb), 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        color: white; font: inherit; font-size: .95rem;
        padding: 11px 16px 11px 42px;
        border-radius: 999px; outline: none;
        transition: border-color .2s, box-shadow .2s;
    }
    #search::placeholder { color: #8b6f73; }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    /* ---------- Games view ---------- */
    #games-view {
        position: fixed; inset: 0; z-index: 10;
        overflow-y: auto;
        padding: 84px 24px 40px;
    }

    #games-grid {
        max-width: 1400px; margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 12px;
    }
    #no-results {
        display: none; text-align: center; color: #8b6f73; margin-top: 60px;
    }

    /* Game blocks */
    .game-block {
        background: var(--panel);
        border-radius: 12px;
        overflow: hidden; cursor: pointer;
        border: 1px solid var(--border);
        transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .game-block:hover {
        transform: translateY(-4px) scale(1.04);
        border-color: var(--accent);
        box-shadow: 0 10px 22px -6px rgba(0,0,0,.6), 0 0 16px var(--accent-glow);
    }
    .game-block img {
        width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
        background: var(--panel-2);
        transition: transform .35s ease;
    }
    .game-block:hover img { transform: scale(1.08); }
    .game-block p {
        margin: 0; padding: 7px 6px;
        text-align: center; font-size: .72rem; font-weight: 500; line-height: 1.25;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; min-height: 2.6em;
    }

    /* ---------- Game player ---------- */
    #game-container {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: black; z-index: 9998; display: none;
    }
    #game-frame { border: none; width: 100vw; height: 100vh; display: block; }
    #back-btn {
        position: fixed; top: 14px; left: 14px; z-index: 9999;
        width: 42px; height: 42px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(var(--accent-rgb), 0.22);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(var(--accent-rgb), 0.35);
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        border-radius: 12px; cursor: pointer;
        transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    #back-btn:hover {
        background: rgba(var(--accent-rgb), 0.55);
        transform: translateX(-2px);
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.35);
    }

    @media (max-width: 640px) {
        #games-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
    }
</style>
</head>
<body>

    <!-- Interactive particle background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Search bar (top middle) -->
    <div id="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search" type="text" placeholder="Search games..." autocomplete="off" spellcheck="false">
    </div>

    <!-- Games view (filled from the GAMES list below) -->
    <div id="games-view">
        <div id="games-grid"></div>
        <p id="no-results">No games found.</p>
    </div>

    <!-- In-page game player -->
    <div id="game-container">
        <button id="back-btn" onclick="closeGame()" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
        <div id="loading-text" style="display:none; color:white; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.5rem; font-weight:600; z-index: 9999;">Loading...</div>
        <iframe id="game-frame" allowfullscreen></iframe>
    </div>

<script>
    // =====================================================================
    //  EDIT HERE — GAME BLOCKS
    //  Each game: { name, img, url }
    //  Add a line to add a game, delete a line to remove one.
    // =====================================================================
    const GAMES = [
    { name: "Race Arena Survival King", img: "img", url: "https://dosl6rc74a8u6.cloudfront.net/html/race_survival_arena_king" }
    { name: "Gun Spin", img: "img", url: "https://d1pgfzxl8xljfg.cloudfront.net/html/gun_spin" }
    { name: "Highway Traffic", img: "img", url: "https://d139khpwsw1rlp.cloudfront.net/2022/unity/highway-traffic" }
    { name: "Granny", img: "img", url: "https://dosl6rc74a8u6.cloudfront.net/html/granny" }
    { name: "Ants Clicker", img: "img", url: "https://d1b8zsan60tues.cloudfront.net/2026/more/ants-clicker" }
    { name: "Ragdoll Archers", img: "img", url: "https://d1pgfzxl8xljfg.cloudfront.net/html/ragdoll_archers" }
    { name: "Snow Rider", img: "img", url: "https://d1pgfzxl8xljfg.cloudfront.net/html/snow_rider_3d" }
    { name: "Deadly Descent", img: "img", url: "https://d1wnrmoe2jrw0g.cloudfront.net/html/deadly_descent" }
    { name: "Ultrakill", img: "img", url: "https://d1pgfzxl8xljfg.cloudfront.net/html/ultrakill" }
    { name: "Minecraft 1.8.8", img: "img", url: "https://d1pgfzxl8xljfg.cloudfront.net/html/minecraft" }
    ];

    // ========== INTERACTIVE PARTICLE BACKGROUND ==========
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null, radius: 120 };
    let animationId = null;
    let particleRGB = '239, 68, 68';
    let trailRGB = '11, 5, 6';
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.2 + 0.8;
            this.baseX = this.x;
            this.baseY = this.y;
            this.density = Math.random() * 25 + 8;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
            this.alpha = Math.random() * 0.5 + 0.25;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${particleRGB}, ${this.alpha})`;
            ctx.fill();
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
            if (mouse.x !== null) {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    const force = (mouse.radius - distance) / mouse.radius;
                    const forceX = (dx / distance) * force * this.density * 0.35;
                    const forceY = (dy / distance) * force * this.density * 0.35;
                    this.x -= forceX;
                    this.y -= forceY;
                }
            }
        }
    }
    function initParticles() {
        particles = [];
        const numberOfParticles = Math.min(Math.floor((canvas.width * canvas.height) / 9000), 140);
        for (let i = 0; i < numberOfParticles; i++) particles.push(new Particle());
    }
    function connectParticles() {
        const maxDistance = 110;
        for (let a = 0; a < particles.length; a++) {
            for (let b = a + 1; b < particles.length; b++) {
                const dx = particles[a].x - particles[b].x;
                const dy = particles[a].y - particles[b].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < maxDistance) {
                    const opacity = 1 - (distance / maxDistance);
                    ctx.strokeStyle = `rgba(${particleRGB}, ${opacity * 0.18})`;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(particles[a].x, particles[a].y);
                    ctx.lineTo(particles[b].x, particles[b].y);
                    ctx.stroke();
                }
            }
        }
    }
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = `rgba(${trailRGB}, 0.15)`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        connectParticles();
        animationId = requestAnimationFrame(animate);
    }
    function onBgMouseMove(e) { mouse.x = e.clientX; mouse.y = e.clientY; }
    function onBgMouseOut() { mouse.x = null; mouse.y = null; }
    window.addEventListener('mousemove', onBgMouseMove);
    window.addEventListener('mouseout', onBgMouseOut);
    window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
    resizeCanvas();
    initParticles();
    animate();

    // ========== GAME LOGIC ==========
    function launchGame(url) {
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        document.body.classList.add('in-game');
        if (loading) loading.style.display = 'none';

        frame.src = url;

        frame.style.display = 'block';
        container.style.display = 'block';
    }

    function closeGame() {
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        container.style.display = 'none';
        document.body.classList.remove('in-game');

        frame.src = '';
        if (loading) loading.style.display = 'none';
    }

    // ========== GAMES VIEW + SEARCH =========
    const searchInput = document.getElementById('search');
    const grid = document.getElementById('games-grid');
    const noResults = document.getElementById('no-results');

    function renderGames() {
        grid.innerHTML = '';
        GAMES.forEach(g => {
            const block = document.createElement('div');
            block.className = 'game-block';
            block.dataset.name = g.name.toLowerCase();
            block.onclick = () => launchGame(g.url);

            const img = document.createElement('img');
            img.src = g.img;
            img.alt = g.name;
            img.loading = 'lazy';

            const p = document.createElement('p');
            p.textContent = g.name;

            block.append(img, p);
            grid.appendChild(block);
        });
    }

    function filterGames() {
        const q = searchInput.value.trim().toLowerCase();
        let shown = 0;
        grid.querySelectorAll('.game-block').forEach(b => {
            const match = b.dataset.name.includes(q);
            b.style.display = match ? '' : 'none';
            if (match) shown++;
        });
        noResults.style.display = shown ? 'none' : 'block';
    }

    searchInput.addEventListener('input', filterGames);

    renderGames();
    filterGames();
</script>

</body>
</html>
